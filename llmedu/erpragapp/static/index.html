<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERP IntelliQ — 영림원소프트랩 ERP 백서 AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── 리셋 ──────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #f5f7fa;
  --surface:   #ffffff;
  --surface2:  #f0f4ff;
  --border:    #e2e8f0;
  --border2:   #c7d4e8;
  --text:      #1a2332;
  --text2:     #4a5568;
  --muted:     #8fa3be;
  --accent:    #2563eb;
  --accent2:   #7c3aed;
  --accent-bg: rgba(37,99,235,0.07);
  --green:     #16a34a;
  --amber:     #d97706;
  --red:       #dc2626;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow:    0 4px 12px rgba(0,0,0,0.08);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.10);
  --radius:    12px;
  --font:      'Pretendard', 'Noto Sans KR', sans-serif;
  --mono:      'JetBrains Mono', monospace;
}

html, body { height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── 헤더 ───────────────────────────────────────────────────────── */
header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px; height: 58px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  flex-shrink: 0;
  z-index: 100;
}

.logo { display: flex; align-items: center; gap: 10px; }
.logo-icon {
  width: 34px; height: 34px; border-radius: 9px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; box-shadow: 0 2px 8px rgba(37,99,235,0.3);
}
.logo-text { font-size: 17px; font-weight: 700; color: var(--text); letter-spacing: -0.3px; }
.logo-badge {
  font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 10px;
  background: var(--accent-bg); color: var(--accent); border: 1px solid rgba(37,99,235,0.2);
  letter-spacing: 0.3px;
}

.header-right { display: flex; align-items: center; gap: 10px; }

.status-pill {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 12px; border-radius: 20px;
  background: #f0fdf4; border: 1px solid #bbf7d0;
  font-size: 12px; color: var(--green); font-weight: 500;
}
.status-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--green); animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:.4} }

.nav-btn {
  padding: 7px 16px; border-radius: 8px;
  border: 1px solid var(--border2);
  background: var(--surface); color: var(--text2);
  font-family: var(--font); font-size: 13px; font-weight: 500;
  cursor: pointer; transition: all .15s;
}
.nav-btn:hover { background: var(--surface2); border-color: var(--accent); color: var(--accent); }

/* ── 레이아웃 ───────────────────────────────────────────────────── */
.layout { display: flex; flex: 1; overflow: hidden; }

/* ── 사이드바 ───────────────────────────────────────────────────── */
.sidebar {
  width: 264px; flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow-y: auto;
  padding: 20px 0;
}

.sidebar-section { padding: 0 14px 22px; }
.section-label {
  font-size: 10px; font-weight: 700; letter-spacing: 1.2px;
  text-transform: uppercase; color: var(--muted);
  margin-bottom: 10px; padding: 0 4px;
}

.filter-btn {
  display: flex; align-items: center; gap: 9px;
  width: 100%; padding: 8px 12px; border-radius: 8px;
  border: none; background: transparent; color: var(--text2);
  font-family: var(--font); font-size: 13px; font-weight: 500;
  cursor: pointer; transition: all .15s; text-align: left; margin-bottom: 2px;
}
.filter-btn:hover { background: var(--surface2); color: var(--text); }
.filter-btn.active { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
.filter-icon { font-size: 16px; width: 22px; text-align: center; }
.filter-dot { width: 8px; height: 8px; border-radius: 50%; margin-left: auto; flex-shrink: 0; }
.filter-dot.pharma  { background: #3b82f6; }
.filter-dot.medical { background: #10b981; }
.filter-dot.beauty  { background: #f59e0b; }
.filter-dot.all     { background: var(--muted); }

.sample-q {
  width: 100%; padding: 9px 12px; border-radius: 8px;
  border: 1px solid var(--border); background: transparent;
  color: var(--text2); font-family: var(--font); font-size: 12px;
  cursor: pointer; transition: all .15s; text-align: left;
  margin-bottom: 6px; line-height: 1.5;
}
.sample-q:hover { background: var(--surface2); border-color: var(--accent); color: var(--text); }
.sample-q-label {
  font-size: 9px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.8px; color: var(--muted); display: block; margin-bottom: 3px;
}

.stat-box {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px;
}
.stat-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.stat-row:last-child { margin-bottom: 0; }
.stat-label { font-size: 12px; color: var(--text2); }
.stat-value { font-size: 14px; font-weight: 700; font-family: var(--mono); color: var(--accent); }

/* ── 채팅 영역 ──────────────────────────────────────────────────── */
.chat-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

.chat-messages { flex: 1; overflow-y: auto; padding: 28px 32px; scroll-behavior: smooth; }
.chat-messages::-webkit-scrollbar { width: 5px; }
.chat-messages::-webkit-scrollbar-track { background: transparent; }
.chat-messages::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

.welcome {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; height: 100%; gap: 16px;
  text-align: center; padding: 40px;
}
.welcome-icon {
  width: 80px; height: 80px; border-radius: 22px;
  background: linear-gradient(135deg, #eff6ff, #f5f3ff);
  border: 2px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 36px; margin-bottom: 4px; box-shadow: var(--shadow);
}
.welcome h2 { font-size: 22px; font-weight: 700; color: var(--text); letter-spacing: -0.5px; }
.welcome p { font-size: 14px; color: var(--text2); max-width: 420px; line-height: 1.7; }

.welcome-chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
.welcome-chip {
  padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border2);
  font-size: 12px; color: var(--text2); background: var(--surface);
  cursor: pointer; transition: all .15s; font-family: var(--font);
}
.welcome-chip:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }

.message { display: flex; gap: 12px; margin-bottom: 22px; animation: fadeUp .3s ease; }
@keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
.message.user { flex-direction: row-reverse; }

.avatar {
  width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; border: 1px solid var(--border);
}
.avatar.ai { background: linear-gradient(135deg, #eff6ff, #f5f3ff); box-shadow: var(--shadow-sm); }
.avatar.user { background: var(--surface2); }

.bubble { max-width: 74%; padding: 14px 18px; border-radius: 12px; font-size: 14px; line-height: 1.8; box-shadow: var(--shadow-sm); }
.message.ai .bubble { background: var(--surface); border: 1px solid var(--border); border-radius: 3px 12px 12px 12px; }
.message.user .bubble { background: linear-gradient(135deg, var(--accent), #4f46e5); color: white; border: none; border-radius: 12px 3px 12px 12px; }

.sources-btn {
  display: inline-flex; align-items: center; gap: 5px;
  margin-top: 10px; padding: 5px 10px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--surface2);
  font-size: 12px; color: var(--text2); cursor: pointer;
  font-family: var(--font); transition: all .15s;
}
.sources-btn:hover { border-color: var(--accent); color: var(--accent); }
.sources-btn .arrow { transition: transform .2s; font-size: 10px; }
.sources-btn.open .arrow { transform: rotate(90deg); }

.sources-list { display: none; margin-top: 8px; }
.sources-list.open { display: flex; flex-direction: column; gap: 6px; }

.source-card { padding: 9px 12px; border-radius: 8px; background: #fafbff; border: 1px solid var(--border); font-size: 12px; }
.source-meta { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.tag { padding: 2px 7px; border-radius: 4px; font-size: 10px; font-weight: 700; letter-spacing: 0.3px; }
.tag.pharma   { background: #dbeafe; color: #1d4ed8; }
.tag.medical  { background: #d1fae5; color: #065f46; }
.tag.beauty   { background: #fef3c7; color: #92400e; }
.tag.common   { background: #f1f5f9; color: var(--text2); }
.source-part  { font-size: 11px; color: var(--muted); }
.source-text  { color: var(--text2); line-height: 1.6; }

.typing-wrap { display: flex; gap: 12px; margin-bottom: 22px; }
.typing-bubble {
  display: flex; align-items: center; gap: 5px;
  padding: 14px 18px; border-radius: 3px 12px 12px 12px;
  background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-sm);
}
.typing-bubble span { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: bounce .9s infinite; }
.typing-bubble span:nth-child(2) { animation-delay: .15s; }
.typing-bubble span:nth-child(3) { animation-delay: .3s; }
@keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-5px)} }

.input-area { padding: 16px 32px 20px; background: var(--surface); border-top: 1px solid var(--border); flex-shrink: 0; }
.pills { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.pill {
  padding: 4px 12px; border-radius: 20px;
  border: 1px solid var(--border); background: var(--surface);
  font-family: var(--font); font-size: 12px; color: var(--text2);
  cursor: pointer; transition: all .15s; font-weight: 500;
}
.pill:hover { border-color: var(--accent); color: var(--accent); }
.pill.active { background: var(--accent); border-color: var(--accent); color: white; font-weight: 600; }

.input-row { display: flex; gap: 10px; align-items: flex-end; }
.input-wrap { flex: 1; border: 1.5px solid var(--border2); border-radius: 12px; background: var(--surface); transition: all .2s; }
.input-wrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,0.10); }

#question {
  width: 100%; padding: 13px 16px; background: transparent; border: none; outline: none;
  color: var(--text); font-family: var(--font); font-size: 14px; resize: none; max-height: 120px; line-height: 1.6;
}
#question::placeholder { color: var(--muted); }

.send-btn {
  width: 46px; height: 46px; border-radius: 11px; border: none;
  background: linear-gradient(135deg, var(--accent), #4f46e5);
  color: white; font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 3px 10px rgba(37,99,235,0.3); transition: all .2s; flex-shrink: 0;
}
.send-btn:hover { transform: translateY(-1px); box-shadow: 0 5px 14px rgba(37,99,235,0.4); }
.send-btn:active { transform: none; }
.send-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

.input-hint { font-size: 11px; color: var(--muted); margin-top: 7px; text-align: center; }

@media (max-width: 768px) {
  .sidebar { display: none; }
  .chat-messages { padding: 16px; }
  .input-area { padding: 12px 16px; }
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">🔍</div>
    <span class="logo-text">ERP IntelliQ</span>
    <span class="logo-badge">RAG · FastAPI + pgvector</span>
  </div>
  <div class="header-right">
    <div class="status-pill">
      <div class="status-dot"></div>
      <span id="chunkBadge">로딩중...</span>
    </div>
    <button class="nav-btn" onclick="location.href='/ingest'">📄 문서 적재</button>
  </div>
</header>

<div class="layout">

  <!-- 사이드바 -->
  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="section-label">산업 필터</div>
      <button class="filter-btn active" data-sec="" onclick="selectFilter(this,'')">
        <span class="filter-icon">🔍</span> 전체 산업
        <span class="filter-dot all"></span>
      </button>
      <button class="filter-btn" data-sec="제약" onclick="selectFilter(this,'제약')">
        <span class="filter-icon">💊</span> 제약
        <span class="filter-dot pharma"></span>
      </button>
      <button class="filter-btn" data-sec="의료기기" onclick="selectFilter(this,'의료기기')">
        <span class="filter-icon">🏥</span> 의료기기
        <span class="filter-dot medical"></span>
      </button>
      <button class="filter-btn" data-sec="화장품" onclick="selectFilter(this,'화장품')">
        <span class="filter-icon">💄</span> 화장품
        <span class="filter-dot beauty"></span>
      </button>
    </div>

    <div class="sidebar-section">
      <div class="section-label">샘플 질문</div>
      <button class="sample-q" onclick="ask('제약 산업에서 ERP 도입이 필요한 이유는?')">
        <span class="sample-q-label">💊 제약</span>
        제약 산업에서 ERP 도입이 필요한 이유는?
      </button>
      <button class="sample-q" onclick="ask('GMP 실사와 마약류 관리를 ERP로 어떻게 처리하나요?')">
        <span class="sample-q-label">💊 제약</span>
        GMP 실사와 마약류 관리 ERP 처리 방법?
      </button>
      <button class="sample-q" onclick="ask('의료기기 BOM 관리와 설계 변경 문제를 어떻게 해결하나요?')">
        <span class="sample-q-label">🏥 의료기기</span>
        의료기기 BOM 관리와 설계변경 해결책?
      </button>
      <button class="sample-q" onclick="ask('화장품 산업에서 멀티채널 주문 관리 문제를 ERP로 해결하는 방법은?')">
        <span class="sample-q-label">💄 화장품</span>
        화장품 멀티채널 주문 관리 해결 방법?
      </button>
      <button class="sample-q" onclick="ask('월 결산 리드타임을 단축하려면 어떻게 해야 하나요?')">
        <span class="sample-q-label">📊 공통</span>
        월 결산 리드타임 단축 방법은?
      </button>
    </div>

    <div class="sidebar-section">
      <div class="section-label">시스템 정보</div>
      <div class="stat-box">
        <div class="stat-row">
          <span class="stat-label">적재 페이지(청크)</span>
          <span class="stat-value" id="statChunks">-</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">청크 단위</span>
          <span class="stat-value" style="font-size:12px">PDF 1페이지</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">임베딩 모델</span>
          <span class="stat-value" style="font-size:11px">text-emb-3-small</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">검색 방식</span>
          <span class="stat-value" style="font-size:11px">pgvector cosine</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- 채팅 -->
  <div class="chat-area">
    <div class="chat-messages" id="chatMessages">
      <div class="welcome" id="welcomeScreen">
        <div class="welcome-icon">📚</div>
        <h2>ERP 백서에 대해 무엇이든 물어보세요</h2>
        <p>제약·의료기기·화장품 산업의 ERP 도입 백서를 기반으로<br>정확한 답변과 출처 페이지를 함께 제공합니다.</p>
        <div class="welcome-chips">
          <button class="welcome-chip" onclick="ask('제약 산업 ERP의 핵심 기능은?')">💊 제약 ERP 핵심 기능</button>
          <button class="welcome-chip" onclick="ask('화장품 ERP 도입 사례를 알려줘')">💄 화장품 도입 사례</button>
          <button class="welcome-chip" onclick="ask('결산 지연 문제를 어떻게 해결하나요?')">📊 결산 지연 해결책</button>
          <button class="welcome-chip" onclick="ask('LOT 추적 관리란?')">🔖 LOT 추적 관리</button>
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="pills">
        <button class="pill active" data-sec="" onclick="selectPill(this,'')">전체</button>
        <button class="pill" data-sec="제약" onclick="selectPill(this,'제약')">💊 제약</button>
        <button class="pill" data-sec="의료기기" onclick="selectPill(this,'의료기기')">🏥 의료기기</button>
        <button class="pill" data-sec="화장품" onclick="selectPill(this,'화장품')">💄 화장품</button>
      </div>
      <div class="input-row">
        <div class="input-wrap">
          <textarea id="question" rows="1"
            placeholder="ERP 도입 백서에 대해 질문하세요… (Enter 전송, Shift+Enter 줄바꿈)"></textarea>
        </div>
        <button class="send-btn" id="sendBtn" onclick="sendQuestion()">↑</button>
      </div>
      <div class="input-hint">RAG: 벡터 검색(pgvector) → Top-5 페이지 → GPT 답변</div>
    </div>
  </div>
</div>

<script>
let selectedSection = '';

window.addEventListener('DOMContentLoaded', () => {
  loadChunkCount();
  setupTextarea();
});

function loadChunkCount() {
  fetch('/api/chunks/count')
    .then(r => r.json())
    .then(d => {
      const cnt = d.count;
      document.getElementById('chunkBadge').textContent = `${cnt}개 페이지 준비됨`;
      document.getElementById('statChunks').textContent = cnt;
    })
    .catch(() => {
      document.getElementById('chunkBadge').textContent = '연결 오류';
    });
}

function selectFilter(btn, sec) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  selectedSection = sec;
  syncPills(sec);
}

function selectPill(pill, sec) {
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  pill.classList.add('active');
  selectedSection = sec;
  syncFilters(sec);
}

function syncPills(sec) {
  document.querySelectorAll('.pill').forEach(p => p.classList.toggle('active', p.dataset.sec === sec));
}
function syncFilters(sec) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.sec === sec));
}

function ask(text) {
  document.getElementById('question').value = text;
  sendQuestion();
}

function setupTextarea() {
  const ta = document.getElementById('question');
  ta.addEventListener('input', () => {
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 120) + 'px';
  });
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendQuestion(); }
  });
}

async function sendQuestion() {
  const input = document.getElementById('question');
  const q = input.value.trim();
  if (!q) return;

  const welcome = document.getElementById('welcomeScreen');
  if (welcome) welcome.remove();

  input.value = '';
  input.style.height = 'auto';
  document.getElementById('sendBtn').disabled = true;

  appendMsg('user', q, null);
  const loadId = appendLoading();

  try {
    const res = await fetch('/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q, section: selectedSection || null })
    });
    if (!res.ok) throw new Error('request failed');
    const data = await res.json();
    removeLoading(loadId);
    appendMsg('ai', data.answer, data.sources);
  } catch {
    removeLoading(loadId);
    appendMsg('ai', '⚠️ 오류가 발생했습니다. 서버 연결 또는 API 키 설정을 확인해 주세요.', null);
  } finally {
    document.getElementById('sendBtn').disabled = false;
    document.getElementById('question').focus();
    loadChunkCount();
  }
}

function appendMsg(role, text, sources) {
  const container = document.getElementById('chatMessages');
  const el = document.createElement('div');
  el.className = `message ${role}`;

  const avatar = document.createElement('div');
  avatar.className = `avatar ${role}`;
  avatar.textContent = role === 'ai' ? '🔍' : '👤';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  const formatted = escHtml(text)
    .replace(/\n/g, '<br>')
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  bubble.innerHTML = formatted;

  if (role === 'ai' && sources && sources.length > 0) {
    const btn = document.createElement('button');
    btn.className = 'sources-btn';
    btn.innerHTML = `<span class="arrow">▶</span> 참고 페이지 ${sources.length}개 보기`;
    btn.onclick = function() {
      this.classList.toggle('open');
      list.classList.toggle('open');
      this.innerHTML = this.classList.contains('open')
        ? `<span class="arrow" style="transform:rotate(90deg)">▶</span> 참고 페이지 ${sources.length}개 닫기`
        : `<span class="arrow">▶</span> 참고 페이지 ${sources.length}개 보기`;
    };

    const list = document.createElement('div');
    list.className = 'sources-list';

    sources.forEach(s => {
      const card = document.createElement('div');
      card.className = 'source-card';
      const tagClass = getTagClass(s.section);
      card.innerHTML = `
        <div class="source-meta">
          <span class="tag ${tagClass}">${s.section || '공통'}</span>
          <span class="tag common">p.${s.page}</span>
          <span class="source-part">#${s.chunkIndex}</span>
        </div>
        <div class="source-text">${escHtml(s.content || '')}</div>
      `;
      list.appendChild(card);
    });

    bubble.appendChild(btn);
    bubble.appendChild(list);
  }

  el.appendChild(avatar);
  el.appendChild(bubble);
  container.appendChild(el);
  container.scrollTop = container.scrollHeight;
}

function getTagClass(sec) {
  if (!sec) return 'common';
  if (sec.includes('제약')) return 'pharma';
  if (sec.includes('의료기기')) return 'medical';
  if (sec.includes('화장품')) return 'beauty';
  return 'common';
}

function appendLoading() {
  const id = 'load-' + Date.now();
  const container = document.getElementById('chatMessages');
  const el = document.createElement('div');
  el.id = id; el.className = 'typing-wrap';
  el.innerHTML = `
    <div class="avatar ai">🔍</div>
    <div class="typing-bubble"><span></span><span></span><span></span></div>
  `;
  container.appendChild(el);
  container.scrollTop = container.scrollHeight;
  return id;
}

function removeLoading(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

function escHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
